{
  "name": "PR250 Quant GUI Focused Verification",
  "permissions": {
    "contents": "read"
  },
  "on": {
    "push": {
      "branches": [
        "verify/pr250-quant-gui-focused"
      ]
    }
  },
  "jobs": {
    "focused": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout exact PR head",
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "004487bbce6b2d479649b951638e89b17ec9b0a1",
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify identity",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"004487bbce6b2d479649b951638e89b17ec9b0a1\"\ntest -z \"$(git status --porcelain)\"\necho PR250_FOCUSED_SOURCE=PASS"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install --upgrade pip\npython -m pip install -e \".[dev]\""
        },
        {
          "name": "Run Quant GUI focused tests",
          "env": {
            "QT_QPA_PLATFORM": "offscreen",
            "QSG_RHI_BACKEND": "software"
          },
          "run": "python -m pytest   tests/test_desktop_quant_research.py   tests/test_desktop_shell.py   tests/test_desktop_packaging.py   tests/test_desktop_localization.py   -q\necho PR250_QUANT_GUI_FOCUSED=PASS"
        }
      ]
    }
  }
}
