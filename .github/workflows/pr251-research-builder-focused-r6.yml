{
  "name": "PR251 Research Builder Focused Verification R6",
  "permissions": {
    "contents": "read"
  },
  "on": {
    "push": {
      "branches": [
        "verify/pr251-research-builder-focused-r6"
      ]
    }
  },
  "jobs": {
    "focused": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout exact candidate",
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "69c44ced000d6d70a7881f9444d279632f6fadde",
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify identity",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"69c44ced000d6d70a7881f9444d279632f6fadde\"\ntest -z \"$(git status --porcelain)\"\necho PR251_FOCUSED_R6_SOURCE=PASS"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install dependencies",
          "run": "python -m pip install --upgrade pip\npython -m pip install -e \".[dev]\""
        },
        {
          "name": "Run focused research builder surface",
          "env": {
            "QT_QPA_PLATFORM": "offscreen",
            "QSG_RHI_BACKEND": "software"
          },
          "run": "python -m pytest   tests/test_research_workspace.py   tests/test_research_dataset_builder.py   tests/test_cross_day_dataset_execution.py   tests/test_cross_day_dataset_semantics.py   tests/test_ts2_feature_execution.py   tests/test_cross_day_execution.py   tests/test_desktop_quant_research.py   tests/test_desktop_shell.py   tests/test_desktop_localization.py   tests/test_desktop_packaging.py   -q\necho PR251_RESEARCH_BUILDER_FOCUSED_R6=PASS"
        }
      ]
    }
  }
}
