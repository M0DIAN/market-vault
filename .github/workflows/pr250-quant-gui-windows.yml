{
  "name": "PR250 Quant GUI Windows Verification",
  "permissions": {
    "contents": "read"
  },
  "on": {
    "push": {
      "branches": [
        "verify/pr250-quant-gui-windows"
      ]
    }
  },
  "jobs": {
    "verify": {
      "runs-on": "windows-latest",
      "steps": [
        {
          "name": "Checkout exact PR head",
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "004487bbce6b2d479649b951638e89b17ec9b0a1",
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify identity",
          "shell": "pwsh",
          "run": "$ErrorActionPreference=\"Stop\"\n$head=(git rev-parse HEAD).Trim()\nif ($head -ne \"004487bbce6b2d479649b951638e89b17ec9b0a1\") { throw \"HEAD drift: $head\" }\nif (git status --porcelain) { throw \"dirty checkout\" }\nWrite-Output \"PR250_WINDOWS_SOURCE=PASS\""
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.11.9",
            "architecture": "x64"
          }
        },
        {
          "name": "Install production build dependencies",
          "shell": "pwsh",
          "run": "$ErrorActionPreference=\"Stop\"\npython -m pip install --upgrade pip\npython -m pip install -e \".[windows-exe]\"\npython -m pip install \"moomoo-api==10.9.6908\"\nif ((python -m PyInstaller --version).Trim() -ne \"6.22.2\") { throw \"PyInstaller version drift\" }\nif ((python -c \"import PySide6; print(PySide6.__version__)\").Trim() -ne \"6.11.2\") { throw \"PySide6 version drift\" }\nWrite-Output \"PR250_WINDOWS_DEPS=PASS\""
        },
        {
          "name": "Build and frozen smoke",
          "shell": "pwsh",
          "run": "$ErrorActionPreference=\"Stop\"\n$out=Join-Path $env:RUNNER_TEMP \"pr250-quant-gui\"\n& .\\scripts\\build_windows_desktop.ps1 -PythonExecutable (Get-Command python).Source -OutputRoot $out -NoZip\nif ($LASTEXITCODE -ne 0) { throw \"Windows build failed\" }\n$meta=Get-Content -LiteralPath (Join-Path $out \"MarketVault\\build-metadata.json\") -Raw | ConvertFrom-Json\nif ($meta.build_head_sha -ne \"004487bbce6b2d479649b951638e89b17ec9b0a1\") { throw \"metadata HEAD drift\" }\nif ($meta.unrelated_cwd_smoke_exit_code -ne 0) { throw \"frozen smoke failed\" }\n$qml=Join-Path $out \"MarketVault\\_internal\\market_vault\\desktop\\qml\\pages\\QuantResearchPage.qml\"\nif (-not (Test-Path -LiteralPath $qml -PathType Leaf)) { throw \"QuantResearchPage.qml missing from bundle\" }\nWrite-Output \"PR250_WINDOWS_ONEDIR=PASS\"\nWrite-Output \"PR250_WINDOWS_FROZEN_SMOKE=PASS\""
        }
      ]
    }
  }
}
