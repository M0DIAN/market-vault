# CI Optimization Framework — self-CI
#
# Dogfoods the framework on its own repository:
#   - classify every change range (fail-closed: resolution errors on the
#     initial export push / unknown config -> tier=full);
#   - heavy steps guarded by the stable tiers and the exact-literal
#     POST_MERGE_REUSE guard;
#   - FULL PR runs create the attempt-bound attestation; main pushes
#     prove V1 reuse.
# Unit tests run offline; the GitHub API surface is mocked.
#
# Job names must match [reuse].required_jobs in ciopt.example.toml:
# test (3.11), test (3.12), package.

name: CI

on:
  push:
    branches:
      - main
      - export/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install framework
        run: |
          cp ciopt.example.toml ciopt.toml
          python -m pip install -e ".[dev]"

      - name: Classify change tier
        id: classify
        run: |
          python -m ci_optimizer classify --config ciopt.toml --mode pull_request \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output env \
            | sed -n \
              -e 's/^tier=/CI_TIER=/p' \
              -e 's/^reason=/CI_TIER_REASON=/p' \
              -e 's/^full_matrix_required=/CI_FULL_MATRIX_REQUIRED=/p' \
            >> "$GITHUB_ENV"

      - name: Compile check (always runs)
        run: python -m compileall -q src tests

      - name: Run unit tests (offline; GitHub API mocked)
        if: |
          env.CI_TIER != 'docs_fast' &&
          env.CI_TIER != 'package_docs' &&
          env.POST_MERGE_REUSE != 'true'
        run: python -m pytest -q

      - name: Marker — FULL tests reused from verified PR
        if: env.POST_MERGE_REUSE == 'true'
        run: echo "FULL_TESTS_REUSED_FROM_VERIFIED_PR=true"

      - name: Marker — FULL tests skipped by policy
        if: env.CI_TIER == 'docs_fast' || env.CI_TIER == 'package_docs'
        run: echo "FULL_TESTS_SKIPPED_BY_POLICY=true"

      - name: Post-merge FULL reuse proof
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.CI_TIER == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          # Exact-literal guard: POST_MERGE_REUSE=true only when every
          # proof succeeds; anything else leaves heavy steps RUNNING.
          python -m ci_optimizer verify-reuse --config ciopt.toml >> "$GITHUB_ENV"
          echo "POST_MERGE_REUSE=${POST_MERGE_REUSE:-false}"

  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install framework
        run: |
          cp ciopt.example.toml ciopt.toml
          python -m pip install -e ".[dev]"

      - name: Classify change tier
        id: classify
        run: |
          python -m ci_optimizer classify --config ciopt.toml --mode pull_request \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output env \
            | sed -n \
              -e 's/^tier=/CI_TIER=/p' \
              -e 's/^reason=/CI_TIER_REASON=/p' \
              -e 's/^full_matrix_required=/CI_FULL_MATRIX_REQUIRED=/p' \
            >> "$GITHUB_ENV"

      - name: Build package (always runs)
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          ls -la dist/

      - name: Create FULL CI attestation
        if: |
          github.event_name == 'pull_request' &&
          env.CI_TIER == 'full' &&
          env.CI_FULL_MATRIX_REQUIRED == 'true'
        run: |
          python -m ci_optimizer create-attestation --config ciopt.toml ci_full_attestation.json
          ls -la ci_full_attestation.json

      - name: Upload FULL CI attestation
        if: |
          github.event_name == 'pull_request' &&
          env.CI_TIER == 'full' &&
          env.CI_FULL_MATRIX_REQUIRED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-attestation-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ci_full_attestation.json
          if-no-files-found: error

      - name: Post-merge FULL reuse proof
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.CI_TIER == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python -m ci_optimizer verify-reuse --config ciopt.toml >> "$GITHUB_ENV"
          echo "POST_MERGE_REUSE=${POST_MERGE_REUSE:-false}"
