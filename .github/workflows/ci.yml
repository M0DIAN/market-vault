name: CI

# Post-merge FULL reuse gate (PR #61): the workflow needs only read access
# for the reuse proof (contents: read, pull-requests: read, actions: read).
# No write permission is granted; artifact uploads use the runtime token.
permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CI Risk-Tier Optimization Phase 1 (+ Component-Aware foundation,
      # DP4): classify the change range once per job. There is no 5th
      # formal job: the repo's release-auditability contract fixes exactly
      # test / portability-pyarrow24 / package, so CI_TIER is exported via
      # $GITHUB_ENV and heavy steps guard on it. Fail-safe: an
      # unset/unknown CI_TIER makes every guard true, so heavy validation
      # always runs unless the tier is exactly a fast tier. The classifier
      # also emits component impact (ci/components.toml); CI_COMPONENTS is
      # exported but no tier change comes from it yet.
      - name: Classify change tier
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            MODE=pull_request
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            MODE=push
          fi
          echo "event=${{ github.event_name }} mode=$MODE base=$BASE head=$HEAD"
          if python scripts/ci_risk_tier.py --repo . --mode "$MODE" --base "$BASE" --head "$HEAD" > ci_tier.txt; then
            cat ci_tier.txt
            tier="$(sed -n 's/^tier=//p' ci_tier.txt)"
            reason="$(sed -n 's/^reason=//p' ci_tier.txt)"
          else
            echo "classifier failed; fail-closing to tier=full"
            cat ci_tier.txt || true
            tier=full
            reason=classifier_error_fail_closed
          fi
          echo "CI_TIER=${tier:-full}" >> "$GITHUB_ENV"
          echo "CI_TIER_REASON=${reason:-classifier_output_missing}" >> "$GITHUB_ENV"
          # Component-aware foundation (DP4): export the classifier's
          # component impact for future component-level gating. No
          # component may skip validation yet, so nothing downstream
          # consumes this besides the log.
          components="$(sed -n 's/^components=//p' ci_tier.txt)"
          echo "CI_COMPONENTS=${components:-none}" >> "$GITHUB_ENV"
          # Post-merge FULL reuse gate (PR #61): the attestation is created
          # only when this run really executed the FULL matrix.
          full_matrix_required="$(sed -n 's/^full_matrix_required=//p' ci_tier.txt)"
          echo "CI_FULL_MATRIX_REQUIRED=${full_matrix_required:-true}" >> "$GITHUB_ENV"

      # Post-merge FULL reuse gate (PR #61): on an eligible main push the
      # verifier proves tree equivalence to a verified PR FULL run. Any
      # missing / ambiguous / stale / malformed / unreachable / failed
      # proof prints POST_MERGE_REUSE=false and every heavy guard below
      # falls back to NORMAL FULL validation (an unset POST_MERGE_REUSE
      # also runs FULL). The verifier is read-only; the token is never
      # printed. "Reuse" is never claimed without verified proof.
      - name: Post-merge FULL reuse proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CI_TIER == 'full'
        # The verifier reads GITHUB_TOKEN from its process environment to
        # query the GitHub API (read-only). Without this step-scoped
        # binding every eligible main push would fail closed with
        # reason=missing_token and the reuse path would be unreachable.
        # The binding is deliberately step-scoped: it must not be
        # workflow-global or job-global.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if python scripts/ci_post_merge_reuse.py > post_merge_reuse.txt; then
            cat post_merge_reuse.txt
            marker="$(sed -n 's/^POST_MERGE_REUSE=//p' post_merge_reuse.txt)"
            reason="$(sed -n 's/^reason=//p' post_merge_reuse.txt)"
          else
            echo "reuse verifier crashed; fail-closing to normal FULL CI"
            marker=false
            reason=verifier_crash_fail_closed
          fi
          echo "POST_MERGE_REUSE=${marker:-false}" >> "$GITHUB_ENV"
          echo "POST_MERGE_REUSE_REASON=${reason:-verifier_output_missing}" >> "$GITHUB_ENV"

      # Authoritative checks that run on every tier (the DOCS_FAST path
      # keeps checkout + classification + whitespace + hygiene).
      - name: Check whitespace in change range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py

      # P1-2 control-plane tier (PR #71): dependency setup and the
      # compile check still run on control_plane, but ONLY on the Python
      # 3.11 leg that executes the conservative six-file control-plane
      # surface. The 3.14 leg of a control_plane run must never run the
      # product FULL suite. unknown/unset CI_TIER keeps this running.
      - name: Install dependencies
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && (env.CI_TIER != 'control_plane' || matrix.python-version == '3.11') && env.POST_MERGE_REUSE != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && (env.CI_TIER != 'control_plane' || matrix.python-version == '3.11') && env.POST_MERGE_REUSE != 'true'
        run: python -m compileall -q src tests scripts examples

      # P1-2 (PR #71): the product FULL pytest stays FULL-only; a
      # validated control_plane run never executes it on either matrix
      # leg. Unknown/unset tier keeps running it (fail-closed to FULL).
      # P1-1 (PR #75): the blanket FULL product pytest now runs ONLY on
      # the Python 3.11 leg. On Python 3.14 the formal contract is the
      # audited 294-node compatibility surface, validated fail-closed by
      # scripts/ci_python314_surface.py and executed by the next two
      # steps; a blanket unqualified FULL pytest on 3.14 is a contract
      # violation.
      - name: Run offline tests
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true' && matrix.python-version == '3.11'
        run: python -m pytest
        # FULL CI performance profiling (measurement only, no behavior
        # change): emit the slowest-durations report for the Python 3.11
        # blanket FULL run. PYTEST_ADDOPTS is step-scoped so targeted
        # pytest invocations never inherit it.
        env:
          PYTEST_ADDOPTS: "--durations=200"

      # P1-1 (PR #75): the Python 3.14 formal contract is the audited
      # compatibility surface sealed in PR #74
      # (docs/python314_compatibility_surface_redesign_canary.md). This
      # validator is fail-closed: it re-derives the sealed resolved-node
      # digest 7561b50a... from a live pytest collection and refuses to
      # proceed on ANY deviation. The manifest hash is pinned inside the
      # validator, and scripts/check_release.py pins this step and its
      # exact guard. Unknown/unset tier keeps both steps running
      # (fail-closed to FULL).
      - name: Validate Python 3.14 compatibility surface
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true' && matrix.python-version == '3.14'
        run: python scripts/ci_python314_surface.py --repo .

      # P1-1 (PR #75): execute exactly the validated surface, fail-closed.
      # The selector list is loaded into an explicit Bash array from the
      # validated manifest ci/python314_compatibility_surface.txt with a
      # hard count check (258), printed for auditability, and expanded
      # quoted into pytest (no command substitution, xargs, eval, globs,
      # -k, markers, or dynamic discovery); the previous validator step
      # must have passed, otherwise this step never runs and the job
      # fails.
      - name: Run Python 3.14 compatibility surface
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true' && matrix.python-version == '3.14'
        run: |
          set -euo pipefail

          mapfile -t PY314_SELECTORS \
            < ci/python314_compatibility_surface.txt

          test "${#PY314_SELECTORS[@]}" -eq 258

          printf 'PY314_SELECTOR_COUNT=%s\n' \
            "${#PY314_SELECTORS[@]}"

          printf '%s\n' "${PY314_SELECTORS[@]}"

          python -m pytest \
            "${PY314_SELECTORS[@]}" \
            -q --durations=200

      # P2-9S (GAP-P2-8 T0/T1 source preconditions): production-topology
      # shadow source-evidence setup. The probe runs the full sealed source
      # measurement ALONGSIDE the validated surface above — it never skips
      # or replaces validation, and no new skip conditions are added. The
      # bundle is finalized (verifier copy -> receipt -> evidence doc ->
      # manifest LAST), replayed offline BEFORE upload (P2-6 gap #2
      # discipline: no further writes after the manifest), and only then
      # uploaded. Artifact names bind exact head / run_attempt / surface.
      # P2-9 pinned-action contract (fail-closed, audited full-SHA pins):
      #   uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      #   uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      # The probe/finalize/replay/upload steps are PR-only: source evidence
      # is pull_request-bound (run_context fails closed without a PR), the
      # same way the FULL CI attestation steps are PR-gated.
      - name: Run P2-9 source fingerprint probe (test-3.14)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true' && matrix.python-version == '3.14'
        run: python scripts/ci_p29_production_topology_shadow.py probe --out-dir p2_9_probe/test-3.14 --surface test-3.14 --head "${{ github.event.pull_request.head.sha }}" --repo "$GITHUB_WORKSPACE"

      - name: Finalize P2-9 source evidence bundle (test-3.14)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true' && matrix.python-version == '3.14'
        run: python scripts/ci_p29_production_topology_shadow.py finalize --out-dir p2_9_probe/test-3.14 --surface test-3.14 --head "${{ github.event.pull_request.head.sha }}" --repo "$GITHUB_WORKSPACE"

      - name: Pre-upload offline replay P2-9 source bundle (test-3.14)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true' && matrix.python-version == '3.14'
        run: |
          python p2_9_probe/test-3.14/verifier_source.py verify-bundle \
            --bundle-dir p2_9_probe/test-3.14 \
            --summary-out p2_9_outside/test-3.14/pre_upload_replay.txt
          grep -q "EVIDENCE_BUNDLE_REPLAY_OK=true" p2_9_outside/test-3.14/pre_upload_replay.txt
          cat p2_9_outside/test-3.14/pre_upload_replay.txt

      - name: Upload P2-9 source evidence bundle (test-3.14)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-vault-p2-9-source-test-3.14-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: |
            p2_9_probe/test-3.14/**
            !p2_9_probe/test-3.14/venvs/**
            !p2_9_probe/test-3.14/sdist_extract_1/**
            !p2_9_probe/test-3.14/sdist_extract_2/**
            !p2_9_probe/test-3.14/remainder_wheelhouse/**
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      # P1-2 control-plane tier (PR #71): the conservative six-file
      # control-plane pytest surface, executed only on Python 3.11 for
      # CI_TIER=control_plane. The file list is literal and reviewable;
      # scripts/check_release.py and its regression tests pin this step,
      # its guard, and its exact six files. No -k / markers / globs /
      # dynamic file discovery / generated selector lists.
      - name: Run conservative control-plane tests
        if: env.CI_TIER == 'control_plane' && matrix.python-version == '3.11'
        run: |
          python -m pytest \
            tests/test_ci_risk_tier.py \
            tests/test_component_aware_tiers.py \
            tests/test_ci_post_merge_reuse.py \
            tests/test_audit_pr.py \
            tests/test_v061_ci_auditability.py \
            tests/test_release_v061.py \
            -q --durations=100
      - name: FULL tests reused from verified PR
        if: env.POST_MERGE_REUSE == 'true'
        run: |
          echo "FULL_TESTS_REUSED_FROM_VERIFIED_PR"
          echo "reason=${{ env.POST_MERGE_REUSE_REASON }}"

      - name: Fast-path tier marker
        if: env.CI_TIER == 'docs_fast' || env.CI_TIER == 'package_docs'
        run: |
          echo "CI_TIER=${{ env.CI_TIER }}"
          echo "FULL_TESTS_SKIPPED_BY_POLICY"

      # P1-2 control-plane tier marker (PR #71): an explicit marker step
      # rather than overloading the old fast marker. On the 3.14 leg the
      # FULL suite is skipped by the validated control-plane policy, and
      # the marker makes that evident in the logs.
      - name: Control-plane tier marker
        if: env.CI_TIER == 'control_plane'
        run: |
          echo "CI_TIER=control_plane"
          echo "CONTROL_PLANE_SUBSET_POLICY_ACTIVE"
          echo "matrix_python_version=${{ matrix.python-version }}"
          if [ "${{ matrix.python-version }}" != "3.11" ]; then
            echo "FULL_SUITE_SKIPPED_BY_CONTROL_PLANE_POLICY"
          fi

  portability-pyarrow24:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Classify change tier
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            MODE=pull_request
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            MODE=push
          fi
          echo "event=${{ github.event_name }} mode=$MODE base=$BASE head=$HEAD"
          if python scripts/ci_risk_tier.py --repo . --mode "$MODE" --base "$BASE" --head "$HEAD" > ci_tier.txt; then
            cat ci_tier.txt
            tier="$(sed -n 's/^tier=//p' ci_tier.txt)"
            reason="$(sed -n 's/^reason=//p' ci_tier.txt)"
          else
            echo "classifier failed; fail-closing to tier=full"
            cat ci_tier.txt || true
            tier=full
            reason=classifier_error_fail_closed
          fi
          echo "CI_TIER=${tier:-full}" >> "$GITHUB_ENV"
          echo "CI_TIER_REASON=${reason:-classifier_output_missing}" >> "$GITHUB_ENV"
          # Component-aware foundation (DP4): export the classifier's
          # component impact for future component-level gating. No
          # component may skip validation yet, so nothing downstream
          # consumes this besides the log.
          components="$(sed -n 's/^components=//p' ci_tier.txt)"
          echo "CI_COMPONENTS=${components:-none}" >> "$GITHUB_ENV"
          # Post-merge FULL reuse gate (PR #61): the attestation is created
          # only when this run really executed the FULL matrix.
          full_matrix_required="$(sed -n 's/^full_matrix_required=//p' ci_tier.txt)"
          echo "CI_FULL_MATRIX_REQUIRED=${full_matrix_required:-true}" >> "$GITHUB_ENV"

      - name: Post-merge FULL reuse proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CI_TIER == 'full'
        # The verifier reads GITHUB_TOKEN from its process environment to
        # query the GitHub API (read-only). Without this step-scoped
        # binding every eligible main push would fail closed with
        # reason=missing_token and the reuse path would be unreachable.
        # The binding is deliberately step-scoped: it must not be
        # workflow-global or job-global.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if python scripts/ci_post_merge_reuse.py > post_merge_reuse.txt; then
            cat post_merge_reuse.txt
            marker="$(sed -n 's/^POST_MERGE_REUSE=//p' post_merge_reuse.txt)"
            reason="$(sed -n 's/^reason=//p' post_merge_reuse.txt)"
          else
            echo "reuse verifier crashed; fail-closing to normal FULL CI"
            marker=false
            reason=verifier_crash_fail_closed
          fi
          echo "POST_MERGE_REUSE=${marker:-false}" >> "$GITHUB_ENV"
          echo "POST_MERGE_REUSE_REASON=${reason:-verifier_output_missing}" >> "$GITHUB_ENV"

      # P1-2 control-plane tier (PR #71): for CI_TIER=control_plane the
      # whole PyArrow 24 product surface (pin / assertion / A / B / C) is
      # skipped — no PyArrow product surface is needed for pure
      # control-plane changes. Existing FULL behavior (and unknown/unset
      # tier fail-closed to FULL) is unchanged.
      - name: Install dependencies
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pin the audited PyArrow 24.0.0 compatibility runtime
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: python -m pip install "pyarrow==24.0.0"

      - name: Assert the audited PyArrow compatibility version
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: python -c "import pyarrow; assert pyarrow.__version__ == '24.0.0'"

      - name: Run audited PyArrow 24 compatibility tests
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: python -m pytest tests/test_v060_portability.py -q

      - name: Run the canonical reader and frozen regression surface
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python -m pytest tests/test_canonical_reader.py -q
          python -m pytest \
            tests/test_sample_generation_core.py \
            tests/test_sample_generation_cli.py -q

      # The audited PyArrow 24 sensitive regression surface (P0-1): the
      # exact six-file replacement for the old blanket full-suite run
      # under PyArrow 24.0.0. The file list is literal and reviewable;
      # scripts/check_release.py and its regression tests pin it. FULL
      # pytest remains in the normal test matrix (3.11 / 3.14).
      - name: Run audited PyArrow 24 sensitive regression surface
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python -m pytest \
            tests/test_canonical_materialization_v03.py \
            tests/test_canonical_builder_v03.py \
            tests/test_dataset_materialization.py \
            tests/test_verified_dataset_reader.py \
            tests/test_pit_sample_assembly.py \
            tests/test_dataset_end_to_end_regression.py \
            -q --durations=100

      # P2-9S (GAP-P2-8 T0/T1 source preconditions): pyarrow24-leg shadow
      # source-evidence setup — same discipline as the test-3.14 leg (probe
      # alongside validation, finalize manifest-last, pre-upload offline
      # replay, PR-only, head/run_attempt/surface-bound artifact names).
      # The P2-9 pinned-action contract (audited full-SHA pins above in the
      # test-3.14 leg) applies to this job's upload step as well.
      - name: Run P2-9 source fingerprint probe (pyarrow24)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: python scripts/ci_p29_production_topology_shadow.py probe --out-dir p2_9_probe/pyarrow24 --surface pyarrow24 --head "${{ github.event.pull_request.head.sha }}" --repo "$GITHUB_WORKSPACE"

      - name: Finalize P2-9 source evidence bundle (pyarrow24)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: python scripts/ci_p29_production_topology_shadow.py finalize --out-dir p2_9_probe/pyarrow24 --surface pyarrow24 --head "${{ github.event.pull_request.head.sha }}" --repo "$GITHUB_WORKSPACE"

      - name: Pre-upload offline replay P2-9 source bundle (pyarrow24)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python p2_9_probe/pyarrow24/verifier_source.py verify-bundle \
            --bundle-dir p2_9_probe/pyarrow24 \
            --summary-out p2_9_outside/pyarrow24/pre_upload_replay.txt
          grep -q "EVIDENCE_BUNDLE_REPLAY_OK=true" p2_9_outside/pyarrow24/pre_upload_replay.txt
          cat p2_9_outside/pyarrow24/pre_upload_replay.txt

      - name: Upload P2-9 source evidence bundle (pyarrow24)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-vault-p2-9-source-pyarrow24-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: |
            p2_9_probe/pyarrow24/**
            !p2_9_probe/pyarrow24/venvs/**
            !p2_9_probe/pyarrow24/sdist_extract_1/**
            !p2_9_probe/pyarrow24/sdist_extract_2/**
            !p2_9_probe/pyarrow24/remainder_wheelhouse/**
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: FULL tests reused from verified PR
        if: env.POST_MERGE_REUSE == 'true'
        run: |
          echo "FULL_TESTS_REUSED_FROM_VERIFIED_PR"
          echo "reason=${{ env.POST_MERGE_REUSE_REASON }}"

      # P1-2 control-plane tier marker (PR #71): the PyArrow 24 surface
      # (pin / assertion / A / B / C) is skipped wholesale for
      # CI_TIER=control_plane — no PyArrow product surface is needed for
      # pure control-plane changes. The marker makes that evident in the
      # logs (skips alone are silent).
      - name: Control-plane tier marker
        if: env.CI_TIER == 'control_plane'
        run: |
          echo "CI_TIER=control_plane"
          echo "CONTROL_PLANE_SUBSET_POLICY_ACTIVE"
          echo "PYARROW24_SUITE_SKIPPED_BY_CONTROL_PLANE_POLICY"

      - name: Fast-path tier marker
        if: env.CI_TIER == 'docs_fast' || env.CI_TIER == 'package_docs'
        run: |
          echo "CI_TIER=${{ env.CI_TIER }}"
          echo "FULL_TESTS_SKIPPED_BY_POLICY"

  package:
    runs-on: ubuntu-latest
    needs: [test, portability-pyarrow24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Classify change tier
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            MODE=pull_request
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            MODE=push
          fi
          echo "event=${{ github.event_name }} mode=$MODE base=$BASE head=$HEAD"
          if python scripts/ci_risk_tier.py --repo . --mode "$MODE" --base "$BASE" --head "$HEAD" > ci_tier.txt; then
            cat ci_tier.txt
            tier="$(sed -n 's/^tier=//p' ci_tier.txt)"
            reason="$(sed -n 's/^reason=//p' ci_tier.txt)"
          else
            echo "classifier failed; fail-closing to tier=full"
            cat ci_tier.txt || true
            tier=full
            reason=classifier_error_fail_closed
          fi
          echo "CI_TIER=${tier:-full}" >> "$GITHUB_ENV"
          echo "CI_TIER_REASON=${reason:-classifier_output_missing}" >> "$GITHUB_ENV"
          # Component-aware foundation (DP4): export the classifier's
          # component impact for future component-level gating. No
          # component may skip validation yet, so nothing downstream
          # consumes this besides the log.
          components="$(sed -n 's/^components=//p' ci_tier.txt)"
          echo "CI_COMPONENTS=${components:-none}" >> "$GITHUB_ENV"
          # Post-merge FULL reuse gate (PR #61): the attestation is created
          # only when this run really executed the FULL matrix.
          full_matrix_required="$(sed -n 's/^full_matrix_required=//p' ci_tier.txt)"
          echo "CI_FULL_MATRIX_REQUIRED=${full_matrix_required:-true}" >> "$GITHUB_ENV"

      - name: Post-merge FULL reuse proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CI_TIER == 'full'
        # The verifier reads GITHUB_TOKEN from its process environment to
        # query the GitHub API (read-only). Without this step-scoped
        # binding every eligible main push would fail closed with
        # reason=missing_token and the reuse path would be unreachable.
        # The binding is deliberately step-scoped: it must not be
        # workflow-global or job-global.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if python scripts/ci_post_merge_reuse.py > post_merge_reuse.txt; then
            cat post_merge_reuse.txt
            marker="$(sed -n 's/^POST_MERGE_REUSE=//p' post_merge_reuse.txt)"
            reason="$(sed -n 's/^reason=//p' post_merge_reuse.txt)"
          else
            echo "reuse verifier crashed; fail-closing to normal FULL CI"
            marker=false
            reason=verifier_crash_fail_closed
          fi
          echo "POST_MERGE_REUSE=${marker:-false}" >> "$GITHUB_ENV"
          echo "POST_MERGE_REUSE_REASON=${reason:-verifier_output_missing}" >> "$GITHUB_ENV"

      - name: Install build tooling
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "build>=1.2,<2" "twine>=5,<7"

      # Lightweight closure bootstrap (PR #63): the release checker below
      # runs unconditionally, and its CLI-version verification invokes
      # `python -m market_vault --version`, which imports the MarketVault
      # runtime (api.py imports pandas). When the normal Install build
      # tooling step did not run — docs_fast tier, control_plane tier
      # (P1-2, PR #71), or verified post-merge reuse skipped the install —
      # bootstrap exactly the runtime dependencies. Package tooling
      # (build/twine) and the heavy package validation chain are
      # unnecessary when verified PR FULL evidence is reused, so they are
      # not installed here.
      - name: Prepare release-checker runtime
        if: env.CI_TIER == 'docs_fast' || env.CI_TIER == 'control_plane' || env.POST_MERGE_REUSE == 'true'
        run: |
          python -m pip install -e .

      # The release/document consistency checker runs on every tier and
      # validates docs/** content (release notes, direction docs,
      # contracts, lifecycle records), so a DOCS_FAST change must not
      # bypass it. The script itself is stdlib-only with no third-party
      # Python dependency, but one production check invokes
      # `python -m market_vault --version` as a subprocess, and that
      # requires the MarketVault runtime to be importable. Lightweight
      # closures therefore prepare the runtime dependencies (see
      # "Prepare release-checker runtime"); the checker must never be
      # assumed to run in an empty Python environment.
      - name: Run release checker
        run: python scripts/check_release.py

      - name: Example renderer help smoke
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: python examples/dataset_cli/render_plans.py --help

      - name: PR-5 verified client example help smoke
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python examples/python_client/read_verified_artifacts.py --help
          echo 'V070_INTEGRATED_ACCEPTANCE_OK'

      - name: Build wheel and sdist
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Confirm exactly one wheel and one sdist
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - name: Install wheel in a fresh virtual environment
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/market-vault --version
          .release-venv/bin/market-vault --help
          .release-venv/bin/market-vault dataset-build --help
          .release-venv/bin/market-vault dataset-verify --help
          .release-venv/bin/market-vault dataset-inspect --help
          .release-venv/bin/market-vault sample-generate --help
          .release-venv/bin/market-vault dataset-catalog-build --help
          .release-venv/bin/market-vault dataset-catalog-verify --help
          .release-venv/bin/market-vault dataset-catalog-list --help
          .release-venv/bin/market-vault dataset-catalog-show --help
          .release-venv/bin/python -c "import market_vault; assert market_vault.__version__ == '0.7.0'"
          .release-venv/bin/python -c "from importlib.metadata import version; assert version('market-vault') == '0.7.0'"

      - name: Fresh-wheel public API smoke check
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          .release-venv/bin/python -c "
          from market_vault.canonical import load_verified_canonical_build
          from market_vault.dataset import (
              orchestrate_dataset_build,
              materialize_dataset_artifacts,
              load_verified_dataset,
              generate_sample_requests,
          )
          print('V061_PUBLIC_API_IMPORT_OK')
          "
          .release-venv/bin/python -c "
          from market_vault.dataset import (
              build_dataset_catalog,
              materialize_dataset_catalog_snapshot,
              load_verified_dataset_catalog,
          )
          print('PR6_CATALOG_API_IMPORT_OK')
          "
          .release-venv/bin/python -c "
          import os
          import sys
          import tempfile
          os.chdir(tempfile.mkdtemp())
          from market_vault import ArtifactClient
          client = ArtifactClient()
          assert callable(client.load_canonical_build)
          assert callable(client.load_dataset)
          assert callable(client.load_dataset_catalog)
          # Before actual reader invocation nothing heavy may be loaded.
          assert 'market_vault.config' not in sys.modules
          assert 'market_vault.storage' not in sys.modules
          assert 'market_vault.canonical' not in sys.modules
          assert 'market_vault.dataset' not in sys.modules
          assert 'duckdb' not in sys.modules
          assert 'pandas' not in sys.modules
          assert 'moomoo' not in sys.modules
          assert 'futu' not in sys.modules
          print('V070_PUBLIC_API_IMPORT_OK')
          "
          .release-venv/bin/python -c "
          import os
          import sys
          import tempfile
          os.chdir(tempfile.mkdtemp())
          from market_vault import ArtifactClient
          client = ArtifactClient()
          cb = client.load_canonical_build
          ds = client.load_dataset
          cat = client.load_dataset_catalog
          assert callable(cb) and callable(ds) and callable(cat)
          # Binding the three read methods must stay lazy.
          assert 'market_vault.config' not in sys.modules
          assert 'market_vault.storage' not in sys.modules
          assert 'market_vault.canonical' not in sys.modules
          assert 'market_vault.dataset' not in sys.modules
          assert 'market_vault.dataset.dataset_catalog_reader' not in sys.modules
          assert 'duckdb' not in sys.modules
          assert 'pandas' not in sys.modules
          assert 'moomoo' not in sys.modules
          assert 'futu' not in sys.modules
          print('V070_CATALOG_CLIENT_IMPORT_OK')
          "
          .release-venv/bin/python -c "
          from market_vault.dataset.dataset_catalog_cli import (
              DATASET_CATALOG_COMMANDS,
          )
          assert DATASET_CATALOG_COMMANDS == frozenset({
              'dataset-catalog-build',
              'dataset-catalog-verify',
              'dataset-catalog-list',
              'dataset-catalog-show',
          })
          "
          echo 'PR7_CATALOG_CLI_HELP_OK'
          echo 'PR8_INTEGRATED_ACCEPTANCE_OK'
          echo 'V070_RELEASED_OK'

      - name: Check wheel contents exclude local data
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          forbidden = ("data/", "catalog/", "manifests/", "reports/", ".venv/", ".duckdb", ".parquet", "examples/", "tests/", ".b64")
          violations = [n for n in names if any(f in n for f in forbidden)]
          assert not violations, f"wheel contains forbidden paths: {violations}"
          print("WHEEL_CONTENTS_OK")
          EOF

      - name: Build package SHA256 manifest
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python - <<'EOF'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"
          assert len(sdists) == 1, f"expected exactly one sdist, got {sdists}"
          files = sorted(wheels + sdists, key=lambda p: p.name)
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in files
          ]
          (dist / "SHA256SUMS.txt").write_text(
              "".join(lines), encoding="utf-8", newline="\n"
          )
          print((dist / "SHA256SUMS.txt").read_text(encoding="utf-8"), end="")
          EOF

      - name: Verify package SHA256 manifest
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          from hashlib import sha256

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1
          expected_names = sorted(p.name for p in wheels + sdists)
          text = (dist / "SHA256SUMS.txt").read_text(encoding="utf-8")
          lines = [ln for ln in text.splitlines() if ln.strip()]
          assert len(lines) == 2, f"expected exactly 2 non-empty lines, got {len(lines)}"
          entries = []
          for ln in lines:
              digest, sep, name = ln.partition("  ")
              assert sep, f"malformed manifest line: {ln!r}"
              assert re.fullmatch(r"[0-9a-f]{64}", digest), f"bad digest: {digest!r}"
              assert name == name.strip(), f"filename has whitespace: {name!r}"
              assert (
                  "/" not in name and "\\" not in name and ".." not in name
              ), f"unsafe filename: {name!r}"
              entries.append((digest, name))
          assert sorted(n for _, n in entries) == expected_names
          for digest, name in entries:
              actual = sha256((dist / name).read_bytes()).hexdigest()
              assert actual == digest, f"SHA256 mismatch for {name}"
          print("SHA256SUMS verification OK")
          EOF

      - name: Upload package audit artifact
        id: package-artifact
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: market-vault-package-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: Confirm package audit artifact metadata
        if: env.CI_TIER != 'docs_fast' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        env:
          PACKAGE_ARTIFACT_ID: ${{ steps.package-artifact.outputs.artifact-id }}
          PACKAGE_ARTIFACT_URL: ${{ steps.package-artifact.outputs.artifact-url }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.package-artifact.outputs.artifact-digest }}
        run: |
          python - <<'EOF'
          import os
          import re

          pid = os.environ["PACKAGE_ARTIFACT_ID"]
          purl = os.environ["PACKAGE_ARTIFACT_URL"]
          pdigest = os.environ["PACKAGE_ARTIFACT_DIGEST"]
          assert pid, "artifact-id must not be empty"
          assert purl, "artifact-url must not be empty"
          assert re.fullmatch(
              r"[0-9a-f]{64}", pdigest
          ), f"artifact-digest must be 64 lowercase hex, got {pdigest!r}"
          print(f"PACKAGE_ARTIFACT_ID={pid}")
          print(f"PACKAGE_ARTIFACT_DIGEST={pdigest}")
          print("V061_PACKAGE_AUDIT_OK")
          EOF

      # P2-9S retained-evidence closure: after the FULL matrix uploaded the
      # two source bundles, the package job downloads each retained artifact
      # (name must bind exact head / run / attempt / surface), replays it
      # read-only with its OWN verifier_source.py, and records a roundtrip
      # receipt OUTSIDE the bundle. The downloaded original is never mutated
      # or re-uploaded. Same PR-only guard as the probe/finalize/upload
      # steps, so fast-tier and post-merge-reuse runs skip both sides
      # consistently.
      - name: Download retained P2-9 source evidence bundle (test-3.14)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: market-vault-p2-9-source-test-3.14-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: p2_9_retained/test-3.14

      - name: Replay retained P2-9 source evidence bundle (test-3.14)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python p2_9_retained/test-3.14/verifier_source.py verify-retained \
            --bundle-dir p2_9_retained/test-3.14 \
            --name "market-vault-p2-9-source-test-3.14-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}" \
            --surface test-3.14 \
            --repo "$GITHUB_WORKSPACE" \
            --summary-out p2_9_roundtrip/test-3.14/roundtrip.txt
          grep -q "ROUNDTRIP_RECEIPT=OK" p2_9_roundtrip/test-3.14/roundtrip.txt
          cat p2_9_roundtrip/test-3.14/roundtrip.txt

      - name: Download retained P2-9 source evidence bundle (pyarrow24)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: market-vault-p2-9-source-pyarrow24-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: p2_9_retained/pyarrow24

      - name: Replay retained P2-9 source evidence bundle (pyarrow24)
        if: github.event_name == 'pull_request' && env.CI_TIER != 'docs_fast' && env.CI_TIER != 'package_docs' && env.CI_TIER != 'control_plane' && env.POST_MERGE_REUSE != 'true'
        run: |
          python p2_9_retained/pyarrow24/verifier_source.py verify-retained \
            --bundle-dir p2_9_retained/pyarrow24 \
            --name "market-vault-p2-9-source-pyarrow24-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}" \
            --surface pyarrow24 \
            --repo "$GITHUB_WORKSPACE" \
            --summary-out p2_9_roundtrip/pyarrow24/roundtrip.txt
          grep -q "ROUNDTRIP_RECEIPT=OK" p2_9_roundtrip/pyarrow24/roundtrip.txt
          cat p2_9_roundtrip/pyarrow24/roundtrip.txt

      # PR FULL attestation (PR #61): after the package job's full chain
      # (which depends on test + portability-pyarrow24 completing FULL)
      # succeeds on a pull_request FULL run, record the exact tested tree
      # and identifiers as an attempt-bound artifact. The release checker
      # above always runs; absence of this attestation can never enable
      # reuse, and attestation creation failure fails the job.
      - name: Create FULL CI attestation
        if: github.event_name == 'pull_request' && env.CI_TIER == 'full' && env.CI_FULL_MATRIX_REQUIRED == 'true'
        run: python scripts/ci_post_merge_reuse.py --create-attestation ci_full_attestation.json

      - name: Upload FULL CI attestation artifact
        id: attestation-artifact
        if: github.event_name == 'pull_request' && env.CI_TIER == 'full' && env.CI_FULL_MATRIX_REQUIRED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: market-vault-full-ci-attestation-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          path: ci_full_attestation.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: Package validation reused from verified PR
        if: env.POST_MERGE_REUSE == 'true'
        run: |
          echo "PACKAGE_VALIDATION_REUSED_FROM_VERIFIED_PR"
          echo "reason=${{ env.POST_MERGE_REUSE_REASON }}"

      # P1-2 control-plane tier marker (PR #71): the whole package build /
      # audit chain is skipped for CI_TIER=control_plane — the package
      # release-checker tail (which DOES run) is the control-plane
      # validation. The marker makes that evident in the logs (skips alone
      # are silent).
      - name: Control-plane tier marker
        if: env.CI_TIER == 'control_plane'
        run: |
          echo "CI_TIER=control_plane"
          echo "CONTROL_PLANE_SUBSET_POLICY_ACTIVE"
          echo "PACKAGE_BUILD_SKIPPED_BY_CONTROL_PLANE_POLICY"

      - name: Fast-path tier marker
        if: env.CI_TIER == 'docs_fast'
        run: |
          echo "CI_TIER=${{ env.CI_TIER }}"
          echo "PACKAGE_BUILD_SKIPPED_BY_POLICY"
