name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python
        run: python -m compileall -q src tests scripts

      - name: Run offline tests
        run: python -m pytest

      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Check whitespace
        run: git diff --check

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "build>=1.2,<2" "twine>=5,<7"

      - name: Run release checker
        run: python scripts/check_release.py

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*

      - name: Confirm exactly one wheel and one sdist
        run: |
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - name: Install wheel in a fresh virtual environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/market-vault --version
          .release-venv/bin/market-vault --help
          .release-venv/bin/python -c "import market_vault; assert market_vault.__version__ == '0.3.0'"
          .release-venv/bin/python -c "from importlib.metadata import version; assert version('market-vault') == '0.3.0'"

      - name: Check wheel contents exclude local data
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          forbidden = ("data/", "catalog/", "manifests/", "reports/", ".venv/", ".duckdb", ".parquet")
          violations = [n for n in names if any(f in n for f in forbidden)]
          assert not violations, f"wheel contains forbidden paths: {violations}"
          print("WHEEL_CONTENTS_OK")
          EOF
