name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python
        run: python -m compileall -q src tests scripts examples

      - name: Run offline tests
        run: python -m pytest

      - name: Check repository hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Check whitespace
        run: git diff --check

  portability-pyarrow24:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pin the audited PyArrow 24.0.0 writer
        run: python -m pip install "pyarrow==24.0.0"

      - name: Assert the audited writer version
        run: python -c "import pyarrow; assert pyarrow.__version__ == '24.0.0'"

      - name: Run the portability surface (canonical reader, frozen regressions, v0.6.0 portability)
        run: |
          python -m pytest tests/test_canonical_reader.py -q
          python -m pytest tests/test_v060_portability.py -q
          python -m pytest \
            tests/test_sample_generation_core.py \
            tests/test_sample_generation_cli.py -q

  package:
    runs-on: ubuntu-latest
    needs: [test, portability-pyarrow24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "build>=1.2,<2" "twine>=5,<7"

      - name: Run release checker
        run: python scripts/check_release.py

      - name: Example renderer help smoke
        run: python examples/dataset_cli/render_plans.py --help

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*

      - name: Confirm exactly one wheel and one sdist
        run: |
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - name: Install wheel in a fresh virtual environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/market-vault --version
          .release-venv/bin/market-vault --help
          .release-venv/bin/market-vault dataset-build --help
          .release-venv/bin/market-vault dataset-verify --help
          .release-venv/bin/market-vault dataset-inspect --help
          .release-venv/bin/market-vault sample-generate --help
          .release-venv/bin/market-vault dataset-catalog-build --help
          .release-venv/bin/market-vault dataset-catalog-verify --help
          .release-venv/bin/market-vault dataset-catalog-list --help
          .release-venv/bin/market-vault dataset-catalog-show --help
          .release-venv/bin/python -c "import market_vault; assert market_vault.__version__ == '0.5.1'"
          .release-venv/bin/python -c "from importlib.metadata import version; assert version('market-vault') == '0.5.1'"

      - name: Fresh-wheel public API smoke check
        run: |
          .release-venv/bin/python -c "
          from market_vault.canonical import load_verified_canonical_build
          from market_vault.dataset import (
              orchestrate_dataset_build,
              materialize_dataset_artifacts,
              load_verified_dataset,
          )
          print('V051_PUBLIC_API_IMPORT_OK')
          "
          .release-venv/bin/python -c "
          from market_vault.dataset import (
              build_dataset_catalog,
              materialize_dataset_catalog_snapshot,
              load_verified_dataset_catalog,
          )
          print('PR6_CATALOG_API_IMPORT_OK')
          "
          .release-venv/bin/python -c "
          from market_vault.dataset.dataset_catalog_cli import (
              DATASET_CATALOG_COMMANDS,
          )
          assert DATASET_CATALOG_COMMANDS == frozenset({
              'dataset-catalog-build',
              'dataset-catalog-verify',
              'dataset-catalog-list',
              'dataset-catalog-show',
          })
          "
          echo 'PR7_CATALOG_CLI_HELP_OK'
          echo 'PR8_INTEGRATED_ACCEPTANCE_OK'

      - name: Check wheel contents exclude local data
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          forbidden = ("data/", "catalog/", "manifests/", "reports/", ".venv/", ".duckdb", ".parquet", "examples/", "tests/")
          violations = [n for n in names if any(f in n for f in forbidden)]
          assert not violations, f"wheel contains forbidden paths: {violations}"
          print("WHEEL_CONTENTS_OK")
          EOF
