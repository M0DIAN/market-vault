[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-vault"
version = "0.1.0"
description = "A reproducible moomoo historical market-data archive using Parquet and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=16",
  "duckdb>=1.1,<2",
  "PyYAML>=6,<7",
  "moomoo-api>=9.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
market-vault = "market_vault.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
