[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-vault"
version = "0.7.0"
description = "A reproducible moomoo historical market-data archive with option metadata using Parquet and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=16",
  "duckdb>=1.1,<2",
  "PyYAML>=6,<7",
  "moomoo-api>=9.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
  "twine>=5,<7",
]
windows-exe = [
  "pyinstaller==6.22.2",
]
desktop = [
  "PySide6==6.11.2",
]

[project.scripts]
market-vault = "market_vault.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"market_vault.desktop" = [
  "qml/*.qml",
  "qml/components/*.qml",
  "qml/pages/*.qml",
  "qml/theme/*.qml",
  "qml/theme/qmldir",
  "assets/fonts/fusion-pixel-12px-proportional-zh_hans-v2026.07.20/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "error:The 'generic' unit for NumPy timedelta is deprecated.*:DeprecationWarning",
]
