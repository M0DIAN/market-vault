# Example configuration for a generic Python repository.
# Copy to ciopt.toml and adjust every value to match your repository.

schema_version = 1

[repository]
main_branch = "main"
workflow_name = "CI"
workflow_path = ".github/workflows/ci.yml"

[paths]
docs = ["docs/"]
package_docs = ["README.md"]
control_plane = [".github/workflows/", "ciopt.toml", "pyproject.toml"]
# Only these exact paths may classify control_plane (the fast-eligible
# subset). Everything else in control_plane forces FULL.
control_plane_eligible = [".github/workflows/ci.yml", "ciopt.toml"]

[components.core]
paths = ["src/"]
requires_full = true

[components.package]
paths = ["pyproject.toml", "README.md"]
requires_package = true

[reuse]
enabled = true
# Exact job names of this workflow (matrix legs included). A missing,
# duplicate, extra, or non-success job denies reuse — it never skips.
required_jobs = ["test (3.11)", "test (3.12)", "package"]
control_plane_paths = [".github/workflows/", "ciopt.toml"]
artifact_prefix = "ci-full-attestation-"
