# Python 3.11 FULL execution ownership. Exact filenames override broad prefixes.
# Each job checks out all files, then executes only its owned test files.
# Unknown, multiply-owned or stale files fail validation; no catch-all partition.
# GUI/business ownership and measured runtime determine these groups, not counts.
